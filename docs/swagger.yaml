definitions:
  common.ErrorResponse:
    properties:
      error:
        type: string
    type: object
  common.HealthResponse:
    properties:
      status:
        type: string
      time:
        type: string
    type: object
  common.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  common.LoginResponse:
    properties:
      access_token:
        type: string
      expires_in:
        type: integer
      refresh_token:
        type: string
    type: object
  common.RegisterRequest:
    properties:
      email:
        type: string
      password:
        minLength: 6
        type: string
      username:
        maxLength: 32
        minLength: 3
        type: string
    required:
    - email
    - password
    - username
    type: object
  common.RegisterResponse:
    properties:
      created_at:
        type: string
      email:
        type: string
      id:
        type: string
      username:
        type: string
    type: object
  schema.UserDataTableResult:
    properties:
      items:
        items:
          $ref: '#/definitions/schema.UserRecord'
        type: array
      total:
        type: integer
    type: object
  schema.UserDatatableResponse:
    properties:
      data:
        $ref: '#/definitions/schema.UserDataTableResult'
    type: object
  schema.UserInfo:
    properties:
      email:
        type: string
      fullName:
        maxLength: 255
        minLength: 1
        type: string
      id:
        type: integer
      isActive:
        default: true
        type: boolean
      isAdmin:
        default: false
        type: boolean
      userRoles:
        items:
          type: string
        type: array
    required:
    - email
    - fullName
    - id
    type: object
  schema.UserRecord:
    properties:
      email:
        type: string
      fullName:
        maxLength: 255
        minLength: 1
        type: string
      id:
        type: integer
      isActive:
        default: true
        type: boolean
      isAdmin:
        default: false
        type: boolean
      userRoles:
        items:
          type: string
        type: array
    required:
    - email
    - fullName
    - id
    type: object
  schema.UserResponse:
    properties:
      data:
        $ref: '#/definitions/schema.UserInfo'
    type: object
info:
  contact: {}
paths:
  /api/crud/user/:
    get:
      consumes:
      - application/json
      description: Retrieve a list of users with datatable support (pagination, filtering,
        etc.)
      parameters:
      - description: Keyword for searching
        in: query
        name: q
        type: string
      - default: 0
        description: Skip (offset)
        in: query
        name: s
        type: integer
      - default: 25
        description: Limit (items per page)
        in: query
        name: ipp
        type: integer
      - collectionFormat: csv
        description: Sort columns (e.g. sb[]=email&sb[]=id)
        in: query
        items:
          type: string
        name: sb[]
        type: array
      - collectionFormat: csv
        description: Sort directions (e.g. sd[]=asc&sd[]=desc)
        in: query
        items:
          type: string
        name: sd[]
        type: array
      - default: ajax
        description: Action type (ajax, excel, csv, pdf)
        in: query
        name: action
        type: string
      - description: Selected ids (JSON array or comma-separated)
        in: query
        name: ids
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/schema.UserDatatableResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/common.ErrorResponse'
      summary: Get user list (datatable)
      tags:
      - admin-user
  /api/crud/user/{id}:
    get:
      consumes:
      - application/json
      description: Retrieve detailed information of a user by ID
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/schema.UserResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/common.ErrorResponse'
      summary: Get user details
      tags:
      - admin-user
  /api/v1/auth/login:
    post:
      consumes:
      - application/json
      description: Authenticate user and return JWT token
      parameters:
      - description: Login credentials
        in: body
        name: credentials
        required: true
        schema:
          $ref: '#/definitions/common.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/common.LoginResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/common.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/common.ErrorResponse'
      summary: Login user
      tags:
      - auth
  /api/v1/auth/register:
    post:
      consumes:
      - application/json
      description: Create a new user account
      parameters:
      - description: User registration data
        in: body
        name: user
        required: true
        schema:
          $ref: '#/definitions/common.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/common.RegisterResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/common.ErrorResponse'
      summary: Register new user
      tags:
      - auth
  /api/v1/health:
    get:
      consumes:
      - application/json
      description: Check if the service is healthy
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/common.HealthResponse'
      summary: Health check
      tags:
      - health
swagger: "2.0"

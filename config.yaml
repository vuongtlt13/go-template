app:
  name: "go-template"
  version: "1.0.0"
  mode: "development"

server:
  port: 8080
  read_timeout: 60
  write_timeout: 60
  idle_timeout: 120

database:
  host: "localhost"
  port: 5432
  user: "postgres"
  password: "postgres"
  dbname: "go_template"
  sslmode: "disable"

jwt:
  secret: "your-secret-key"
  expiration_period: 24 # hours

redis:
  host: "localhost"
  port: 6379
  password: ""
  db: 0

log:
  level: "debug"
  filename: "logs/app.log"
  max_size: 100
  max_backups: 3
  max_age: 7
  compress: true
